name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.197.3
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "--- 1. Synchronisation du dépôt ---"
            cd /var/www/lassez-repo
            git remote set-url origin https://github.com/Flayrox/LASSEZ.git
            git fetch origin main
            git reset --hard origin/main

            echo "--- 2. Copie vers l'environnement unique ---"
            rsync -av --exclude=node_modules --exclude=.next --exclude=.env --exclude=media --exclude=.git /var/www/lassez-repo/ /var/www/lassez-api/

            echo "--- 3. Build unique Next.js ---"
            cd /var/www/lassez-api
            npm ci
            npx prisma generate
            npm run build

            echo "--- 4. Redémarrage propre sous PM2 ---"
            pm2 startOrReload ecosystem.config.cjs
            echo "✓ Déploiement unique Silicon Valley terminé avec succès !"
