name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.197.3
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "--- Synchronisation Git sur le VPS ---"
            cd /var/www/lassez-repo
            git remote set-url origin https://github.com/Flayrox/LASSEZ.git
            git fetch origin main
            git reset --hard origin/main

            echo "--- Copie des fichiers vers api, front et studio ---"
            rsync -av --exclude=node_modules --exclude=.next --exclude=.env --exclude=media --exclude=.git /var/www/lassez-repo/ /var/www/lassez-api/
            rsync -av --exclude=node_modules --exclude=.next --exclude=.env --exclude=media --exclude=.git /var/www/lassez-repo/ /var/www/lassez-front/
            rsync -av --exclude=node_modules --exclude=.next --exclude=.env --exclude=media --exclude=.git /var/www/lassez-repo/ /var/www/lassez-studio/

            echo "--- Build Next.js sur les 3 environnements ---"
            cd /var/www/lassez-api && npm run build
            cd /var/www/lassez-front && npm run build
            cd /var/www/lassez-studio && npm run build

            echo "--- Redémarrage de l'ensemble des services PM2 ---"
            pm2 restart all
            echo "✓ Auto-déploiement multi-instances terminé avec succès !"
