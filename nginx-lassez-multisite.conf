# Configuration Nginx pour LASSEZ v3 - Multi-domaine
# Note: Après déploiement, lancez 'certbot --nginx' pour activer le SSL réel.

# Redirection HTTP vers HTTPS (Optionnel, recommandé après SSL)
# server {
#     listen 80;
#     server_name lassez.fr www.lassez.fr api.lassez.fr studio.lassez.fr;
#     return 301 https://$host$request_uri;
# }

# API (Payload CMS)
server {
    listen 80;
    listen [::]:80;
    server_name api.lassez.fr;

    # SSL (Placeholder - Certbot le remplira)
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/api.lassez.fr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.lassez.fr/privkey.pem;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# Frontend Principal
server {
    listen 80;
    listen [::]:80;
    server_name lassez.fr www.lassez.fr;

    # SSL (Placeholder)
    # listen 443 ssl;

    # Compression
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~* ^/api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

