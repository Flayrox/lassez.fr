    enableDiscord: true # social_discord_enabled = true (+ test mode)
    discordTestMode: true # discord_test_mode = true
    enableQoe: true # remplace enablePayloadCMS
    enableX: false # social_twitter_enabled = false
    enableBluesky: false # social_bluesky_enabled = false
    enableMastodon: false # social_mastodon_enabled = false
