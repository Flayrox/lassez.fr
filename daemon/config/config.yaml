    minDelayMinutes: 1 # min_delay_min = 1
    maxDelayMinutes: 2 # max_delay_min = 2
    enableAutoPublish: false # auto_pilot_enabled = false !
    enableAutoApprove: false # auto_approve_enabled — Mode Fantôme (IA approuve sans modération)
    enableAutoApproveMedia: true # mode fantôme : garder l'enrichissement média (false = PENDING direct, sans nœud Image)
