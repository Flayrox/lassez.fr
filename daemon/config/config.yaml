formats: [{"id": "FLASH", "nom": "\U0001F6A8 FLASH", "actif": true, "couleur": "#F59E0B", "description": "Information très courte, factuelle, un événement ponctuel ou une action choc.", "consigne": "=== FORMAT EXIGÉ : \"FLASH\" ===\nLe public scroll très vite. Ton flash doit faire entre 1 et 3 lignes MAX. C'est brut, factuel, et implacable. Tu te dois de trouver l'angle qui dénonce le système.", "exemples": ["\U0001F6A8\U0001F1EB\U0001F1F7 FLASH | Le parquet de Paris a ouvert une enquête après la plainte de la gymnaste Djenna Laroui, qui dénonce cyberharcèlement et insultes racistes depuis qu'elle a quitté l'équipe de France pour représenter l'Algérie.", "\U0001F6A8\U0001F1EB\U0001F1F7\U0001F4FA\U0001F4C9 FLASH\nLes audiences de CNews sont en DÉGRINGOLADE.", "\U0001F6A8\U0001F1F7\U0001F1FA\U0001F1E8\U0001F1FA INFO :\nUn pétrolier russe transportant environ 100 000 tonnes de brut serait arrivé à Cuba, illustrant le soutien énergétique de Moscou à l'île.", "\U0001F1EB\U0001F1F7\U0001F5BC️ FLASH\nLe maire de Saint-Denis, Bally Bagayoko (LFI), a décroché le portrait d'Emmanuel Macron de son bureau à la mairie. (TF1)"], "schema": "{\"taxonomie\":\"FLASH\",\"geo\":\"international | france\",\"tags\":[\"tag1\",\"tag2\"],\"headline\":\"[ÉMOJI] SUJET : TITRE EN MAJUSCULES\",\"body\":\"\U0001F6A8 [ÉMOJIS DE CONTEXTE] FLASH | [Ton flash très court, factuel, qui dénonce en 2 ou 3 phrases max.]\",\"image_search_queries\":[\"..\",\"...\"],\"metadata\":{\"accent_color\":\"#F59E0B\"}}"}, {"id": "CITATION", "nom": "⚡️ CITATION", "actif": true, "couleur": "#8B5CF6", "description": "Une phrase choc, polémique ou révélatrice prononcée par une figure publique/politique.", "consigne": "=== FORMAT EXIGÉ : \"CITATION\" ===\nTrouve LA phrase la plus choquante, cynique ou hypocrite dans les sources, et expose-la à nu en 1 ou 2 lignes MAX. Ne rajoute pas d'édito lourd, la citation doit se suffire à elle-même comme arme de dénonciation.", "exemples": ["⚡️\U0001F1EB\U0001F1F7CITATION - « Je pense que les jeunes rentrent trop tard sur le marché du #travail », Jordan #Bardella, 30 ans. (itw CNews)", "⚡️\U0001F4B0CITATION - « La fraude sociale coûte un 'pognon de dingue' selon le président », pendant que l'évasion fiscale représente 80 à 100 milliards d'euros par an de manque à gagner."], "schema": "{\"taxonomie\":\"CITATION\",\"geo\":\"international | france\",\"tags\":[\"tag1\",\"tag2\"],\"headline\":\"[ÉMOJI] SUJET EN MAJUSCULES\",\"body\":\"⚡️ [ÉMOJIS DE CONTEXTE] CITATION - « [La citation exacte de l'article] », [Nom de l'auteur], [Âge ou Titre si pertinent]. ([Source])\",\"image_search_queries\":[\"..\",\"...\"],\"metadata\":{\"accent_color\":\"#8B5CF6\"}}"}, {"id": "ALERTE", "nom": "\U0001F534 ALERTE INFO", "actif": true, "couleur": "#DC2626", "description": "Sujet grave, systémique, nécessitant une analyse et un démontage en règle.", "consigne": "=== FORMAT EXIGÉ : \"ALERTE\" ===\nAnalyse la gravité de l'information. C'est un scandale majeur, une répression violente, une urgence absolue, ou une loi passée sous radar.\n- Ligne 1 : \U0001F534 ALERTE INFO ! (ou \U0001F6A8 ALERTE GÉNÉRALE !)\n- Structure du body :\n  Ligne 1 : L'en-tête ALERTE\n  Ligne 2 : [ÉMOJI] SUJET : TITRE CHOC 100% EN MAJUSCULES, SANS SUSPENSE, DÉNONCIATEUR.\n  Ligne 3 : Paragraphe factuel. Phrases courtes. Utilise des MAJUSCULES sur quelques mots-clés choquants pour l'emphase. Sors les vrais chiffres et rappelle le contexte/le passif. Cite la source principale.\n  Ligne 4 : Le tacle/Le démontage : Une phrase courte, souvent une question rhétorique ou accusation implacable pointant le \"deux poids, deux mesures\".\n\n=== LA RÈGLE DU TITRE ===\nTon titre doit être une balle entre les deux yeux.\n-> MAUVAIS : \U0001F1EA\U0001F1FA INFO - LE VOTE DU PARLEMENT SUR L'IMMIGRATION\n-> EXCELLENT : \U0001F1EA\U0001F1FA UE : LA DROITE ET L'EXTRÊME DROITE S'ALLIENT POUR IMPORTER L'ICE AMÉRICAINE EN EUROPE.\n-> MAUVAIS : ⚖️ INFO - LES AFFAIRES DE LA MINISTRE DE LA CULTURE\n-> EXCELLENT : ⚖️ JUSTICE : RACHIDA DATI, LA MINISTRE AUX MILLE ET UNE AFFAIRES JUDICIAIRES.", "exemples": ["\U0001F6A8 ALERTE GÉNÉRALE !\n\n\U0001F4BC GOUVERNEMENT : LES ARRÊTS MALADIE SONT DÉSORMAIS DANS LE VISEUR DE MATIGNON QUI ESTIME QU'ILS COÛTENT TROP CHER.\n\nAlors que les conditions de travail se dégradent partout, le Premier ministre annonce vouloir SÉVIR contre les travailleurs malades. Pendant ce temps, les milliards d'évasion fiscale des grandes entreprises restent INTOUCHABLES. (Le Parisien)\n\nJusqu'où iront-ils pour protéger les caisses du patronat ?", "\U0001F534 ALERTE INFO !\n\n⚖️ JUSTICE : DES AGENTS DE L'ÉTAT JUGÉS POUR TENTATIVES D'ASSASSINAT EN BANDE ORGANISÉE.\n\n22 personnes, dont des policiers et des agents de la DGSE, comparaissent dans l'affaire de la loge maçonnique Athanor pour avoir orchestré des contrats criminels.\n\nL'État traque le moindre mot de travers des syndicalistes sous couvert de \"maintien de l'ordre\", mais détourne le regard quand ses propres agents montent des escadrons de la mort privés.", "\U0001F534 ALERTE INFO !\n\n\U0001F4FA MÉDIAS : UNE COMMUNICANTE DE JORDAN BARDELLA RECYCLÉE EN FAUSSE JOURNALISTE SUR CNEWS.\n\nEva Duparc, spécialiste de la viralité pour le Rassemblement National et nouvelle recrue du média identitaire Frontières, vient d'être parachutée à l'antenne de la chaîne du milliardaire Bolloré. Elle y est désormais présentée comme une pure et simple « journaliste ». (Mediapart)\n\nLa frontière entre les rédactions et les organes du parti d'extrême droite n'existe plus. CNews, chaîne d'information ou bureau de campagne permanent ?"], "schema": "{\"taxonomie\":\"ALERTE\",\"geo\":\"international | france\",\"tags\":[\"tag1\",\"tag2\",\"tag3\"],\"headline\":\"[ÉMOJI] SUJET : TITRE EN MAJUSCULES\",\"body\":\"[Ligne 1]\\n\\n[ÉMOJI] SUJET : TITRE EN MAJUSCULES\\n\\n[Texte factuel avec mots en MAJUSCULES.]\\n\\n[Tacle final ou question.]\",\"image_search_queries\":[\"..\",\"...\"],\"metadata\":{\"accent_color\":\"#DC2626\"}}"}, {"id": "DECRYPTAGE", "nom": "\U0001F50E DÉCRYPTAGE", "actif": true, "couleur": "#000000", "description": "Analyse d'un système, conflit d'intérêt complexe, loi passée sous radar.", "consigne": "=== FORMAT EXIGÉ : \"DÉCRYPTAGE\" ===\nAnalyse systémique d'un sujet complexe. Décortique les conflits d'intérêt, les mécanismes de prédation économique ou les dérives législatives.\n- Ligne 1 : \U0001F50E DÉCRYPTAGE (ou \U0001F9E0 ENQUÊTE)\n- Structure identique à ALERTE mais avec un ton plus analytique et froid.\n- Expose les structures, les flux financiers, les réseaux de pouvoir.", "exemples": ["\U0001F50E DÉCRYPTAGE\n\n\U0001F6E2️ ÉCONOMIE : TOTAL A MULTIPLIÉ SES BÉNÉFICES PAR QUATRE.\n\nEn pleine flambée des prix de l'énergie, TotalEnergies multiplie ses bénéfices PAR QUATRE sur le dos des consommateurs. La France Insoumise avait exigé le BLOCAGE DES PRIX et la taxation de ces superprofits, mais le fameux \"arc républicain\" s'y est farouchement opposé pour protéger le géant pétrolier.\nTotal s'évade fiscalement en déclarant des \"pertes\" en France pour ne payer AUCUN impôt sur les sociétés, et reçoit même des SUBVENTIONS de l'État pour ses activités polluantes. (BFM Business)\n\nLa fraude sociale des pauvres est traquée au centime près, le braquage fiscal des multinationales est subventionné par vos impôts."], "schema": "{\"taxonomie\":\"DÉCRYPTAGE\",\"geo\":\"international | france\",\"tags\":[\"tag1\",\"tag2\",\"tag3\"],\"headline\":\"[ÉMOJI] SUJET : TITRE EN MAJUSCULES\",\"body\":\"\U0001F50E DÉCRYPTAGE\\n\\n[ÉMOJI] SUJET : TITRE EN MAJUSCULES\\n\\n[Analyse structurelle.]\\n\\n[Conclusion implacable.]\",\"image_search_queries\":[\"..\",\"...\"],\"metadata\":{\"accent_color\":\"#000000\"}}"}, {"id": "INFO", "nom": "\U0001F4F0 INFO", "actif": true, "couleur": "#3B82F6", "description": "Actualité classique mais marquante à développer.", "consigne": "=== FORMAT EXIGÉ : \"INFO\" ===\nActualité classique mais marquante. Traitement factuel avec un angle critique.\n- Ligne 1 : \U0001F4F0 L'INFO !\n- Structure similaire à ALERTE mais plus mesuré dans le ton.\n- L'accent est sur l'information brute et son contexte systémique.", "exemples": ["\U0001F30D DIPLOMATIE : LE PAPE LÉON XIV RECADRE DONALD TRUMP DEPUIS L'AFRIQUE ET DÉNONCE L'EXPLOITATION DU CONTINENT.\n\nEn pleine tournée en Angola et au Cameroun, le souverain pontife fustige les \"tyrans du corps et de l'esprit\" et dénonce l'accaparement des richesses. Refusant de s'abaisser à débattre avec un Donald Trump ENRAGÉ par ses discours sur la justice sociale, Léon XIV choisit le terrain. (La Croix)"], "schema": "{\"taxonomie\":\"INFO\",\"geo\":\"international | france\",\"tags\":[\"tag1\",\"tag2\"],\"headline\":\"[ÉMOJI] SUJET : TITRE EN MAJUSCULES\",\"body\":\"\U0001F4F0 L'INFO !\\n\\n[ÉMOJI] SUJET : TITRE EN MAJUSCULES\\n\\n[Texte factuel.]\\n\\n[Mise en perspective.]\",\"image_search_queries\":[\"..\",\"...\"],\"metadata\":{\"accent_color\":\"#3B82F6\"}}"}]
memory: # mémoire éditoriale — ce qu'on a publié, injecté dans l'orchestrateur + la rédaction
    enabled: true
    windowDays: 30
pipeline: # graphe visuel du studio (Atelier) — nœuds actifs
    graphJson: "{\"nodes\":[{\"type\":\"ingestion\",\"enabled\":true},{\"type\":\"dedup\",\"enabled\":true},{\"type\":\"orchestrator\",\"enabled\":true},{\"type\":\"research\",\"enabled\":true},{\"type\":\"editor\",\"enabled\":true},{\"type\":\"validator\",\"enabled\":true},{\"type\":\"media\",\"enabled\":false}]}"
