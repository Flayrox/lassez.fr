    targetsByType: # matrice format → plateforme (clé = id du format) — social_targets_by_type_json réel
        FLASH: {qoe: true, discord: false, x: false, bluesky: false, mastodon: false}
        CITATION: {qoe: true, discord: false, x: false, bluesky: false, mastodon: false}
        ALERTE: {qoe: true, discord: true, x: false, bluesky: false, mastodon: false}
        DECRYPTAGE: {qoe: true, discord: false, x: false, bluesky: false, mastodon: false}
        INFO: {qoe: true, discord: false, x: false, bluesky: false, mastodon: false}
